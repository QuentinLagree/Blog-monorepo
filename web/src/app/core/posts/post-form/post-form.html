<div class="fcol">
  <div class="main-container-form p-5">
    <h1>Rédige ton article !</h1>

    <form [formGroup]="form" class="flex col gap-5 pt-5 pb-4">
      <app-input [control]="titleControl" [configuration]="{
              label: 'Titre',
              placeholder: 'Entrez le titre de l\'article',
              required: true,
              type: 'text'
            }" />
      <app-textarea [control]="descriptionControl" [configuration]="{
              label: 'Description',
              placeholder: 'Ajoute une description',
              required: true
            }"></app-textarea>
    </form>
    <p class="label">Contenu</p>
    <div class="fullscreen-editor">
      <app-textarea [noShadow]="true" [contextMenuTrigger]="''" [contextMenuAction]="formatFromContextMenu"
        class="markdown" (scrolled)="onEditorScroll($event)" (keydown)="onTabPress($event)" #markdownEditor
        [control]="contentControl" [configuration]="{
                label: '',
                required: false,
                placeholder: '',
            }"></app-textarea>
      <nav class="options">
        <div class="flex col">
          <app-button icon="icon-eye" size="md" label="" type="secondary" (clicked)="togglePreview()"></app-button>
          <input #imagePicker type="file" accept="image/*" hidden (change)="onPickImage($event)" />

          <app-button icon="icon-image-picker" size="md" label="" type="secondary" 
            (clicked)="imagePicker.click()"></app-button>
        </div>
        <app-button icon="icon-save" size="md" label="" type="primary" (clicked)="saveManual()"></app-button>
      </nav>
      <span class="line"></span>
      <div #preview (wheel)="blockScroll($event)" (click)="onPreviewClick($event)" class="pl-2 preview"
        [class.hide]="showPreview()">
        <markdown class="variable-binding" [data]="resolvedMarkdown()" katex>
        </markdown>
        <div class="pill">Preview</div>
      </div>
      <input #relinkPicker type="file" accept="image/*" hidden (change)="onRelinkPicked($event)" />
    </div>
    <div class="actionbar">
            <div class="buttons frow gap-3">
              <app-button  size="sm" type="outlined" [label]="'Enregister en tant que brouillon'"></app-button>
              <app-button (clicked)="submit()" [loading]="loading()" size="sm" [label]="(this.post() ? 'Enregistrer les modifications' : 'Créer l\'article')"></app-button>
            </div>
            <app-button (clicked)="goBack()" size="sm" type="danger" [label]="'Annulé'"></app-button>
        </div>
  </div>
</div>
