<h1>Profil section</h1>

<h1>{{ user()?.email}}</h1>

<div class="main-container fcol gap-5">
    <app-button [label]="`${this.showDraftsPosts ? 'Masquer' : 'Afficher'} les brouillons`" (clicked)="this.showDraftsPosts = !this.showDraftsPosts"></app-button>

    @if (this.showDraftsPosts) {
        <ng-paginator [items]="this.drafts.value() ?? []" [isDraft]="true" />
    }
    
    
    
    <app-button-danger label="Supprimer le profile"></app-button-danger>
</div>
