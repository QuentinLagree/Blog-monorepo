<header class="header">
  <div class="header-left">
    <a class="header-brand" routerLink="/">
      <span class="header-logo"></span>

      <div class="header-brand__content">
        <h1>{{ title() }}</h1>
      </div>
    </a>
  </div>

  <nav class="header-nav">
    @let userId = this._session.getUserIdSync();
    @let role = this._session.getUserRoleSync();

    @if (userId != undefined) {
      @if (role == "admin") {
        <span class="header-badge">Admin</span>
      }

      <app-button
        type="secondary"
        label="Mon profil"
        size="sm"
        (clicked)="this._router.navigate(['/account/profil'])">
      </app-button>

      <app-button
        type="danger"
        size="sm"
        label="Se déconnecter"
        (clicked)="openModal()">
      </app-button>
    }
  </nav>
</header>

<app-confirm-modal
  [open]="modalOpen"
  title="Se déconnecter ?"
  message="Tu vas quitter ton espace personnel. Tu pourras te reconnecter à tout moment pour retrouver tes articles, tes brouillons et ton profil."
  confirmLabel="Se déconnecter"
  cancelLabel="Rester connecté"
  variant="danger"
  [loading]="loading"
  (cancelled)="modalOpen = false"
  (confirmed)="logout()">
</app-confirm-modal>
