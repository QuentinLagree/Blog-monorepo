<header>
  <a href="/"><h1>{{ title() }}</h1></a>

  <nav>
    @if (this._session.getUserIdSync() != undefined) {
      <app-button label="Mon profil" size="sm" (clicked)="this._router.navigate(['/account/profil'])"></app-button>
      <app-button type="danger" size="sm" [loading]="loading" label="Se déconnecter" (clicked)="this.logout()" ></app-button>
    }
  </nav>
</header>
