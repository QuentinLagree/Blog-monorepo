<section class="auth-page forgot-password-page">
  <div class="auth-page__container auth-page__container--wide">
    <div class="form-card auth-card forgot-password-card">
      <header class="form-card__header">
        <p class="text-eyebrow">
          Réinitialisation
        </p>

        <h1 class="form-card__title">
          Mot de passe oublié ?
        </h1>

        <p class="form-card__description">
          Ne t’inquiète pas, indique ton adresse email et nous t’enverrons un lien pour créer un nouveau mot de passe.
        </p>
      </header>

      <form
        [formGroup]="form"
        class="form forgot-password-card__form">

        <app-input-email
          [control]="emailControl"
          [configuration]="{
            label: 'Adresse email',
            placeholder: 'Entrez votre adresse email',
            required: true,
            type: 'email'
          }">
        </app-input-email>

        <div class="form-actions form-actions--full forgot-password-card__actions">
          <app-button
            [full]="true"
            (clicked)="submit()"
            size="lg"
            type="primary"
            [label]="loading ? 'Envoi du mail en cours...' : 'Demander un nouveau mot de passe'"
            [disabled]="!form.valid"
            [loading]="loading">
          </app-button>
        </div>
      </form>

      <div class="auth-card__register">
        <span>
          Tu te souviens de ton mot de passe ?
        </span>

        <a routerLink="/auth/login">
          Retour à la connexion
        </a>
      </div>
    </div>
  </div>
</section>
