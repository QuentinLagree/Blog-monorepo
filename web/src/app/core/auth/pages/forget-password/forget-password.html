<div class="flex frow-center">
  <div class="main-container-form p-5">
    <h1>Mot de passe oublié ? </h1>
    <p>Ne vous inquiétez pas, on va tout faire pour le retrouver !</p>
    <form [formGroup]="form" class="stack gap-4 pt-5">
      <app-input-email
        [control]="emailControl"
        [configuration]="{
  label: 'Adresse Email',
  placeholder: 'Entrez votre adresse email',
  required: true,
  type: 'email'
}"
      />
      
      <app-button
          [full]="true"
        (clicked)="submit()"
        class="full"
        size="lg"
        [label]="loading ? 'Envoie du mail en cours...' : 'Demander un nouveau mot de passe'"
        [disabled]="!form.valid"
        [loading]="loading"
      ></app-button>
    </form>
  </div>
</div>
