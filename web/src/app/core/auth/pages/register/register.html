<section class="auth-page register-page">
  <div class="auth-page__container auth-page__container--wide">
    <div class="form-card auth-card register-card">
      <header class="form-card__header">
        <p class="text-eyebrow">
          Inscription
        </p>

        <h1 class="form-card__title">
          Crée ton espace
        </h1>

        <p class="form-card__description">
          Rejoins la communauté pour publier tes articles, sauvegarder tes brouillons et personnaliser ton expérience.
        </p>
      </header>

      <form
        [formGroup]="form"
        class="form register-card__form">

        <div class="form-row">
          <app-input
            [control]="firstnameControl"
            [configuration]="{
              label: 'Prénom',
              placeholder: 'Entrez votre prénom',
              required: true,
              type: 'text'
            }">
          </app-input>

          <app-input
            [control]="lastnameControl"
            [configuration]="{
              label: 'Nom de famille',
              placeholder: 'Entrez votre nom de famille',
              required: true,
              type: 'text'
            }">
          </app-input>
        </div>

        <app-input
          [control]="pseudoControl"
          [configuration]="{
            label: 'Pseudo',
            placeholder: 'Entrez votre pseudonyme',
            required: true,
            type: 'text'
          }">
        </app-input>

        <app-input-email
          [control]="emailControl"
          [configuration]="{
            label: 'Adresse email',
            placeholder: 'Entrez votre adresse email',
            required: true,
            type: 'email'
          }">
        </app-input-email>

        <app-input-password
          [control]="passwordControl"
          [configuration]="{
            label: 'Mot de passe',
            placeholder: 'Entrez votre mot de passe.',
            required: true,
            type: 'password',
            showPassword: true,
            displayStrenghMeterPassword: true
          }">
        </app-input-password>

        <app-input-password
          [control]="confirmPasswordControl"
          [configuration]="{
            label: 'Confirmation du mot de passe',
            placeholder: 'Entrez de nouveau votre mot de passe.',
            required: true,
            type: 'password'
          }">
        </app-input-password>

        <div class="form-actions form-actions--full">
          <app-button
            (clicked)="submit()"
            [full]="true"
            size="lg"
            type="primary"
            [loading]="loading"
            [label]="loading ? 'Inscription en cours...' : 'S’inscrire'"
            [disabled]="!form.valid">
          </app-button>
        </div>
      </form>

      <div class="auth-card__register">
        <span>
          Tu as déjà un compte ?
        </span>

        <a routerLink="/auth/login">
          Connecte-toi
        </a>
      </div>
    </div>
  </div>
</section>
