<div class="flex frow-center">
  <div class="main-container-form p-5">
    <h1>Nouveau mot de passe </h1>
    <p>Nous allons trouver le meilleur et le plus sécurisé des mots de passe !</p>

    {{ !this.form.valid }}
    <form [formGroup]="form" class="stack gap-4 pt-5">
      <app-input-password
        [control]="passwordControl"
        [configuration]="{
  label: 'Mot de passe',
  placeholder: 'Entrez votre mot de passe',
  required: true,
  type: 'password',
  showPassword: true,
  displayStrenghMeterPassword: true
    
}"
      />
      <app-input-password
        [control]="confirmPasswordControl"
        [configuration]="{
  label: 'Confirmation du Mot de passe',
  placeholder: 'Entrez de nouveau votre mot de passe',
  required: true,
  type: 'password',
    
}"
      />
      
      <app-button
          [full]="true"
        (clicked)="submit()"
        class="full"
        size="lg"
        [label]="loading ? 'Sauvegarde du nouveau mot de passe' : 'Enregistrement du nouveau mot de passe'"
        [disabled]="!form.valid"
        [loading]="loading"
      ></app-button>
    </form>
  </div>
</div>
