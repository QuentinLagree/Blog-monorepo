<section class="auth-page new-password-page">
  <div class="auth-page__container auth-page__container--wide">
    <div class="form-card auth-card new-password-card">
      <header class="form-card__header">
        <p class="text-eyebrow">
          Sécurité
        </p>

        <h1 class="form-card__title">
          Nouveau mot de passe
        </h1>

        <p class="form-card__description">
          Choisis un mot de passe solide pour sécuriser ton compte et retrouver l’accès à ton espace.
        </p>
      </header>

      <form
        [formGroup]="form"
        class="form new-password-card__form">

        <app-input-password
          [control]="passwordControl"
          [configuration]="{
            label: 'Mot de passe',
            placeholder: 'Entrez votre mot de passe',
            required: true,
            type: 'password',
            showPassword: true,
            displayStrenghMeterPassword: true
          }">
        </app-input-password>

        <app-input-password
          [control]="confirmPasswordControl"
          [configuration]="{
            label: 'Confirmation du mot de passe',
            placeholder: 'Entrez de nouveau votre mot de passe',
            required: true,
            type: 'password',
            showPassword: true
          }">
        </app-input-password>

        <div class="form-actions form-actions--full new-password-card__actions">
          <app-button
            [full]="true"
            (clicked)="submit()"
            size="lg"
            type="primary"
            [label]="loading ? 'Sauvegarde du nouveau mot de passe...' : 'Enregistrer le nouveau mot de passe'"
            [disabled]="!form.valid"
            [loading]="loading">
          </app-button>
        </div>
      </form>

      <div class="auth-card__register">
        <span>
          Tu te souviens de ton mot de passe ?
        </span>

        <a routerLink="/auth/login">
          Retour à la connexion
        </a>
      </div>
    </div>
  </div>
</section>
