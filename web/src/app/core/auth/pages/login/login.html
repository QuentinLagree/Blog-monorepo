<div class="flex frow-center">
  <div class="main-container-form p-5">
    <h1>Ravis de te revoir !</h1>
    <form [formGroup]="form" class="stack gap-4 pt-5">
      <app-input-email
        [control]="emailControl"
        [configuration]="{
  label: 'Adresse Email',
  placeholder: 'Entrez votre adresse email',
  required: true,
  type: 'email'
}"
      />

      <app-input-password
        [control]="passwordControl"
        [configuration]="{
  label: 'Mot de passe',
  placeholder: 'Entrez votre mot de passe',
  required: true,
  type: 'password',
  showPassword: true,
}"
      >
      <a href="/auth/forget-password" class="main-container-form-link-password">
      Mot de passe oublié ?
      </a>
  </app-input-password>
      
      <app-button
          [full]="true"
        (clicked)="submit()"
        class="full"
        size="lg"
        [label]="loading ? 'Connection en cours...' : 'Se connecter'"
        [disabled]="!form.valid"
        [loading]="loading"
      ></app-button>
    </form>
    <p class="main-container-form-link">
      Vous n'avez pas de compte ? <a href="auth/register">Inscris-toi</a>.
    </p>
  </div>
</div>
  @if (!prod) {
  <a (click)="setFormWithMode('admin')">
    <p class="baseline" style="
    position: fixed;
    bottom: 10px;
    left: 10px;
    z-index: 99999;
    background-color: black;
    color: rgb(226, 226, 9);
    font-size: 0.8em;
    user-select: none;
    padding: 0.2em 2em;
  ">
      Connection Admin
    </p>
  </a>

  <a (click)="setFormWithMode('user')">
    <p class="baseline" style="
    position: fixed;
    bottom: 40px;
    left: 10px;
    z-index: 99999;
    background-color: black;
    color: rgb(226, 226, 9);
    font-size: 0.8em;
    user-select: none;
    padding: 0.2em 2em;
  ">
      Connection User
    </p>
  </a>
  }
